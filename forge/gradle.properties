# MC
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.20.2)
java_version=17

# Forge
forge_version=47.4.4
forge_version_range=[47,)
loader_version_range=[47,)

# Create (upstream Creators-of-Create, resolved from maven.createmod.net).
# The bridge targets ControlsUtil.isActuallyPressed(KeyMapping), unchanged since 6.0.x.
create_version=6.0.8-291

# Runtime dependency mod versions
# The API floor is 0.8.5, so a 0.8.7 runtime requirement leaves room for 0.8.8
# pre-release builds: Maven orders "0.8.8-rc.1" BELOW "0.8.8", so a "[0.8.8,)" floor
# would make Forge refuse to load against a 0.8.8 release candidate.
controlflex_version_range=[0.8.7,)
create_version_range=[6.0.7,)
