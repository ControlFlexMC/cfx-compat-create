pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'SpongePowered'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
        maven {
            name = 'NeoForge'
            url = 'https://maven.neoforged.net/releases'
        }
    }

    plugins {
        id 'net.neoforged.moddev' version '2.0.141'
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

// This branch (1.21.1) has the single 1.21.1 loader; MC 1.20.1 (Forge + Fabric) lives on the 1.20.1 branch.
include 'neoforge'

rootProject.name = 'cfx-compat-create'
