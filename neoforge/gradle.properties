# Create for 1.21.1, compile-only target for the shared mixin. Fetched as a plain file
# (see neoforge/build.gradle). ControlsUtil.isActuallyPressed(KeyMapping) has the same
# signature as 1.20.1, so the shared mixin applies unchanged.
create_version=6.0.10
create_url=https://cdn.modrinth.com/data/LNytGWDc/versions/UjX6dr61/create-1.21.1-6.0.10.jar

# Runtime dependency mod versions
# The API floor is 0.8.5, so a 0.8.7 runtime requirement leaves room for 0.8.8
# pre-release builds (a "[0.8.8,)" floor would reject "0.8.8-rc.1").
controlflex_version_range=[0.8.7,)
create_version_range=[6.0.9,)
