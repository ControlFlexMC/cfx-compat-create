org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
# Gradle 8.8 cannot run on a JDK newer than 22 (this machine defaults to 25), so the
# daemon is pinned to a JDK it supports. The compile toolchain is set independently in
# neoforge/build.gradle. Remove this line on CI, where setup-java provides the JDK.
org.gradle.java.home=/Library/Java/JavaVirtualMachines/microsoft-21.jdk/Contents/Home

# Build tools
mixin_processor_version=0.8.5

# Mod (shared with the 1.20.1 branch)
mod_id=cfx_compat_create
mod_version=0.8.8
build_id=0
mod_name=Control Flex x Create
mod_authors=ifels
mod_license=MIT
mod_description=Create train controls controller bridge for ControlFlex
maven_group=com.ifels

# Runtime dependency mod ids (provided at runtime)
controlflex_mod_id=controlflex
create_mod_id=create

# ControlFlex API (plain Java, loader-agnostic), resolved from JitPack:
#   com.github.ControlFlexMC:control-flex-api:<version>
# This is the COMPILE-TIME API version only. The RUNTIME floor lives in
# neoforge/gradle.properties (0.8.7): the bridge only calls
# isAvailable()/IActionStateProvider/isGameActionActive(), all present since 0.8.5,
# so it does not need to demand the newest API at runtime.
controlflex_api_version=0.8.8
