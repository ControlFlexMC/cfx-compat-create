name: Release Build

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: microsoft

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build (release)
        run: ./gradlew :forge:build :fabric:build -Prelease --no-daemon

      - name: Collect jars
        id: jars
        run: |
          mkdir -p dist
          cp forge/build/libs/*.jar dist/
          cp fabric/build/libs/*.jar dist/
          ls -1 dist
          {
            echo "files<<EOF"
            ls -1 dist/*.jar
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.jars.outputs.files }}
